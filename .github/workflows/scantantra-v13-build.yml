name: SCANTANTRA v1.3 APK Validation

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/scantantra-v13-build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scanner-ultra-v1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build SCANTANTRA v1.3
        working-directory: scanner-ultra
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Stage APK
        run: cp scanner-ultra/app/build/outputs/apk/debug/app-debug.apk SCANTANTRA-v1.3-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SCANTANTRA-v1.3-APK
          path: SCANTANTRA-v1.3-debug.apk
          if-no-files-found: error
          retention-days: 14
