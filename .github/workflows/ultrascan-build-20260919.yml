name: Build UltraScan APK

on:
  push:
    branches: [ultrascan-build-20260919]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Restore UltraScan source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scanner-app
          cat ultrascan-src.part* > ultrascan-src.tar.gz.b64
          base64 -d ultrascan-src.tar.gz.b64 > ultrascan-src.tar.gz
          tar -xzf ultrascan-src.tar.gz -C scanner-app

      - name: Apply UltraScan compiler fixes
        working-directory: scanner-app
        shell: bash
        run: patch -p1 < ../ultrascan-appui.patch

      - name: Apply compileSdk 37 compatibility
        working-directory: scanner-app
        shell: bash
        run: patch -p1 < ../ultrascan-sdk37.patch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          test -x /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager

      - name: Install Android API 37
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: scanner-app
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee android-build.log

      - name: Publish build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UltraScan-build-diagnostics
          path: scanner-app/android-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraScan-debug-apk
          path: scanner-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
