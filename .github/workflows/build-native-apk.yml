name: Build Nakhat Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore native Android source
        shell: bash
        run: |
          set -euo pipefail
          cat chunks/00 chunks/01 chunks/02 chunks/03 chunks/04 chunks/05a chunks/05b chunks/05c chunks/06a chunks/06b chunks/06c chunks/07 > native-source.b64
          test "$(wc -c < native-source.b64)" -eq 42984
          base64 -d native-source.b64 > native-source.zip
          unzip -t native-source.zip
          unzip -qo native-source.zip
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          python3 -c "from pathlib import Path; p=Path('app/src/main/java/in/nakhat/app/ui/CartAdapter.java'); s=p.read_text(); s=s.replace('minus.setInsetLeft(0);minus.setInsetRight(0);','').replace('plus.setInsetLeft(0);plus.setInsetRight(0);',''); p.write_text(s)"

      - name: Apply native shopping UI V3
        shell: bash
        run: |
          set -euo pipefail
          cat overrides_v3/00 overrides_v3/01 overrides_v3/02 overrides_v3/03 overrides_v3/04 overrides_v3/05 overrides_v3/06 overrides_v3/07 > ui-v3.b64
          test "$(wc -c < ui-v3.b64)" -eq 45208
          base64 -d ui-v3.b64 > ui-v3.zip
          unzip -t ui-v3.zip
          unzip -qo ui-v3.zip
          test -f app/src/main/java/in/nakhat/app/ui/WishlistFragment.java
          test -f app/src/main/res/drawable/ic_menu.xml

      - name: Apply V3.1 visual polish and exact brand logo
        shell: bash
        run: |
          set -euo pipefail
          cat overrides_v31/00 overrides_v31/01 > ui-v31.b64
          test "$(wc -c < ui-v31.b64)" -eq 9260
          base64 -d ui-v31.b64 > ui-v31.zip
          unzip -t ui-v31.zip
          unzip -qo ui-v31.zip
          mkdir -p app/src/main/res/drawable-nodpi
          curl --fail --location --retry 3 --connect-timeout 15 \
            https://nakhat.in/assets/images/nakhat-logo.png \
            -o app/src/main/res/drawable-nodpi/nakhat_brand_logo.png
          test -s app/src/main/res/drawable-nodpi/nakhat_brand_logo.png
          grep -q 'nakhat_brand_logo' app/src/main/AndroidManifest.xml
          grep -q 'bottomDock' app/src/main/java/in/nakhat/app/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build native debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee android-build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics-v31
          path: android-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Rename APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk Nakhat-by-Janhvi-Native-V3.1.apk

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: Nakhat-by-Janhvi-Native-V3.1-APK
          path: Nakhat-by-Janhvi-Native-V3.1.apk
          if-no-files-found: error
          retention-days: 30
