name: Build Nakhat Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore native Android source
        shell: bash
        run: |
          set -euo pipefail
          cat chunks/00 chunks/01 chunks/02 chunks/03 chunks/04 chunks/05a chunks/05b chunks/05c chunks/06a chunks/06b chunks/06c chunks/07 > native-source.b64
          test "$(wc -c < native-source.b64)" -eq 42984
          base64 -d native-source.b64 > native-source.zip
          unzip -t native-source.zip
          unzip -qo native-source.zip
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          sed -i 's/\.setInsetLeft(0);//g; s/\.setInsetRight(0);//g' app/src/main/java/in/nakhat/app/ui/CartAdapter.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build native debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee android-build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: android-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Rename APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk Nakhat-by-Janhvi-Native-V2.apk

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: Nakhat-by-Janhvi-Native-V2-APK
          path: Nakhat-by-Janhvi-Native-V2.apk
          if-no-files-found: error
          retention-days: 30
