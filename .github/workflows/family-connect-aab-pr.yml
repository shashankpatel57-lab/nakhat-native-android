name: Family Connect AAB Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'family-connect/**'
      - '.github/workflows/family-connect-aab-pr.yml'

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing key
        working-directory: family-connect
        run: base64 -d test-signing-keystore.b64 > familyconnect-test.jks

      - name: Build release AAB
        working-directory: family-connect
        run: gradle :app:bundleRelease --stacktrace --no-daemon

      - name: Prepare AAB
        run: cp family-connect/app/build/outputs/bundle/release/app-release.aab FamilyConnect-in.familyconnect.app-v7.0.1.aab

      - name: Verify AAB signature and archive
        run: |
          jarsigner -verify -verbose -certs FamilyConnect-in.familyconnect.app-v7.0.1.aab >/tmp/jarsigner.txt
          unzip -t FamilyConnect-in.familyconnect.app-v7.0.1.aab >/tmp/unzip.txt
          grep -q "jar verified" /tmp/jarsigner.txt
          grep -q "No errors detected" /tmp/unzip.txt

      - name: Check configured application ID
        run: |
          grep -q 'applicationId = "in.familyconnect.app"' family-connect/app/build.gradle.kts
          echo "Configured applicationId: in.familyconnect.app"

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyConnect-in-familyconnect-app-AAB
          path: FamilyConnect-in.familyconnect.app-v7.0.1.aab
          if-no-files-found: error
          retention-days: 7
