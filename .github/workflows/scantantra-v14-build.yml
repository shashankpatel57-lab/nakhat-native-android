name: SCANTANTRA v1.4 Drive API APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/scantantra-v14-build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scanner-ultra-v1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: scantantra-oauth-debug-keystore-v1

      - name: Ensure stable debug signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v               -keystore ~/.android/debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=SCANTANTRA Debug,O=SCANTANTRA,C=IN"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | tee scantantra-signing.txt

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build SCANTANTRA v1.4
        working-directory: scanner-ultra
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Stage APK and certificate info
        run: |
          cp scanner-ultra/app/build/outputs/apk/debug/app-debug.apk SCANTANTRA-v1.4-debug.apk
          keytool -printcert -jarfile SCANTANTRA-v1.4-debug.apk >> scantantra-signing.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SCANTANTRA-v1.4-APK
          path: |
            SCANTANTRA-v1.4-debug.apk
            scantantra-signing.txt
          if-no-files-found: error
          retention-days: 30
