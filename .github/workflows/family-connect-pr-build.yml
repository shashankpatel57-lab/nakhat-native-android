name: Temporary Family Connect PR Build

on:
  pull_request:
    branches:
      - main
    paths:
      - 'family-connect/**'
      - '.github/workflows/family-connect-pr-build.yml'

permissions:
  contents: read

jobs:
  build-family-connect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: family-connect
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp family-connect/app/build/outputs/apk/debug/app-debug.apk FamilyConnect-v1-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyConnect-v1-preview
          path: FamilyConnect-v1-preview.apk
          if-no-files-found: error
          retention-days: 7
