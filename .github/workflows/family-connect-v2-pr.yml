name: Family Connect V2 PR Build

on:
  pull_request:
    branches:
      - main
    paths:
      - 'family-connect/**'
      - '.github/workflows/family-connect-v2-pr.yml'

permissions:
  contents: read

jobs:
  build-family-connect-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode stable test signing key
        working-directory: family-connect
        run: base64 -d test-signing-keystore.b64 > familyconnect-test.jks

      - name: Build V2 APK
        working-directory: family-connect
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        run: cp family-connect/app/build/outputs/apk/debug/app-debug.apk FamilyConnect-v2-preview.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyConnect-v2-preview
          path: FamilyConnect-v2-preview.apk
          if-no-files-found: error
          retention-days: 7
